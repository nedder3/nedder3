<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />
  <rect width="1200" height="320" fill="url(#grid)" />

  <!-- Top Accent Highlight Line -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#cyanGrad)" stroke-width="3" />
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#0284c7" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="240" r="160" fill="#38bdf8" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Status Indicator Pill -->
  <g transform="translate(425, 45)">
    <rect width="350" height="30" rx="15" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="15" r="4.5" fill="#10b981" />
    <circle cx="20" cy="15" r="8" fill="#10b981" fill-opacity="0.25" />
    <text x="36" y="19.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">OPEN TO WORLDWIDE REMOTE (USD)</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">ARIEL JAIME</text>

  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" fill="url(#cyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="700" letter-spacing="0.2">Senior Backend Engineer &amp; Distributed AI Systems Architect</text>

  <!-- Capability Tags Container -->
  <g transform="translate(230, 225)">
    <!-- Tag 1: Java 21 -->
    <rect x="0" y="0" width="130" height="32" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="65" y="20.5" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600">Java 21 LTS</text>

    <!-- Tag 2: Distributed Systems -->
    <rect x="145" y="0" width="180" height="32" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="235" y="20.5" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600">Distributed Systems</text>

    <!-- Tag 3: High Concurrency -->
    <rect x="340" y="0" width="170" height="32" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <text x="425" y="20.5" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600">High Concurrency</text>

    <!-- Tag 4: Autonomous AI Swarms -->
    <rect x="525" y="0" width="215" height="32" rx="6" fill="#111827" stroke="#0284c7" stroke-width="1" />
    <text x="632" y="20.5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600">Autonomous AI Swarms</text>
  </g>
</svg>
